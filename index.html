
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Landing Page - Emely Smith</title>

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS personnalisé -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- En-tête fixe -->
    <header class="container-fluid">
        <nav class="navbar navbar-expand-lg w-100">

            <!-- Logo -->
            <a href="#" class="logo navbar-brand">Design</a>

            <!-- Bouton du menu mobile -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuNavigation"
                aria-controls="menuNavigation"
                aria-expanded="false"
                aria-label="Ouvrir le menu"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navigation -->
            <div
                class="collapse navbar-collapse justify-content-end"
                id="menuNavigation"
            >
                <ul class="navbar-nav align-items-lg-center gap-lg-4">

                    <li class="nav-item">
                        <a class="nav-link" href="#">Accueil</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Services</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Qui nous sommes</a>
                    </li>

                    <li class="nav-item">
                        <a href="#" class="btn">Contact</a>
                    </li>

                </ul>
            </div>

        </nav>
    </header>

    <!-- Contenu principal -->
    <main class="container">

        <section class="home text-center">

            <h4>Emely Smith</h4>

            <h1>
                Capturing the beauty
                <br class="d-none d-md-block">
                of your journey
            </h1>

            <!-- Galerie de photos responsive -->
            <div class="images">

                <div class="image-item">
                    <img
                        src="images/image1.jpg"
                        alt="Photographie 1"
                    >
                </div>

                <div class="image-item">
                    <img
                        src="images/image2.jpg"
                        alt="Photographie 2"
                    >
                </div>

                <div class="image-item">
                    <img
                        src="images/image3.jpg"
                        alt="Photographie 3"
                    >
                </div>

                <div class="image-item">
                    <img
                        src="images/image4.jpg"
                        alt="Photographie 4"
                    >
                </div>

            </div>

        </section>

    </main>

    <!-- JavaScript Bootstrap pour le menu mobile -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
